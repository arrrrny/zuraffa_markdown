name: zuraffa_markdown_example
description: Demonstrates how to use the zuraffa_markdown package.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  markdown: ^7.3.0
  material_ui: ^1.11.1
  zuraffa_markdown:
    path: ../


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  assets:
    - assets/

  fonts:
    - family: 'Roboto Mono'
      fonts:
        - asset: fonts/RobotoMono-Regular.ttf

  uses-material-design: true

dartfmt:
  line_length: 120