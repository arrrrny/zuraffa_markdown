name: zuraffa_markdown
description: A Markdown renderer for Flutter with first-class material_ui support.
  Create rich text output, including text styles, tables, links, and more, from plain
  text data formatted with simple Markdown tags. A Zuraffa-maintained continuation of
  flutter_markdown_plus.
repository: https://github.com/arrrrny/zuraffa_markdown
issue_tracker: https://github.com/arrrrny/zuraffa_markdown/issues
documentation: https://pub.dev/documentation/zuraffa_markdown/latest/
version: 7.6.1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  markdown: ^7.3.1
  meta: ^1.16.0
  path: ^1.9.1
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.10
  mockito: ^5.7.0
  standard_message_codec: ^0.0.1+4

topics:
  - markdown
  - material-ui
  - widgets
  - zuraffa

screenshots:
  - description: Rich text, emphasis, blockquotes and lists rendered from Markdown.
    path: screenshots/formatting.png
  - description: GitHub Flavored Markdown tables and task-list checkboxes.
    path: screenshots/tables.png
  - description: Fenced and inline code blocks with monospace styling.
    path: screenshots/code.png

formatter:
  page_width: 120